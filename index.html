                // 计算运行时间
                let durationText = '';
                if (task.duration) {
                    // 已完成/失败，显示总耗时
                    durationText = formatDuration(task.duration);
                } else if (task.startTime && task.status === 'running') {
                    // 运行中，实时计算
                    const elapsed = Math.round((new Date() - new Date(task.startTime)) / 1000);
                    durationText = formatDuration(elapsed);
                }

                return `
                    <div class="task-record-item status-${st}">
                        <div class="task-record-header">
                            <span class="task-record-id" title="${task.id}">${task.id}</span>
                            <span class="task-record-status ${st}">${statusEmoji[st]} ${statusText[st] || st}${durationText ? ' · ' + durationText : ''}</span>
                        </div>
                        <div class="task-record-time">${new Date(task.time).toLocaleString()}</div>
                        <div class="task-record-actions" style="margin-bottom: 8px;">
                            ${task.videoUrl ? `<button class="btn btn-primary btn-sm" onclick="previewTaskVideo('${task.id}')">▶️ 预览</button>` : ''}
                            <button class="btn btn-secondary btn-sm" onclick="toggleTaskDebug('${task.id}')">🐛 调试</button>
                            <button class="btn btn-danger btn-sm" onclick="removeTaskRecord('${task.id}')">🗑️</button>
                        </div>
                        <div class="task-debug-content" id="debug-${task.id}" style="display: none; background: #1a1a1a; color: #00ff88; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 4px; max-height: 300px; overflow-y: auto;">
                            <div style="color: #74c0fc; margin-bottom: 4px;">请求体:</div>
                            <div style="background: #0d0d0d; padding: 8px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin-bottom: 8px;">${escapeHtml(task.requestLog || '')}</div>
                            <div style="color: #74c0fc; margin-bottom: 4px;">响应日志:</div>
                            <div style="background: #0d0d0d; padding: 8px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-all;">${escapeHtml(task.responseLog || '')}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function toggleTaskDebug(taskId) {
            const el = document.getElementById(`debug-${taskId}`);
            if (el) {
                el.style.display = el.style.display === 'none' ? 'block' : 'none';
            }
        }
        
        function previewTaskVideo(taskId) {
            const task = activeTasks.get(taskId);
            if (task && task.videoUrl) {
                document.getElementById('playerWindow').style.display = 'block';
                document.getElementById('resultVideo').src = task.videoUrl;
                document.getElementById('downloadLink').href = task.videoUrl;
                document.getElementById('playerInfoText').textContent = `任务 ID: ${taskId}`;
                document.getElementById('playerWindow').scrollIntoView({ behavior: 'smooth' });
            }
        }
        
        // 格式化时长为 mm:ss 或 hh:mm:ss
        function formatDuration(seconds) {
            if (seconds < 60) {
                return `${seconds}s`;
            } else if (seconds < 3600) {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}m${s.toString().padStart(2, '0')}s`;
            } else {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h}h${m.toString().padStart(2, '0')}m${s.toString().padStart(2, '0')}s`;
            }
        }

        function removeTaskRecord(taskId) {
            const task = activeTasks.get(taskId);
            if (task && task.timer) clearInterval(task.timer);
            if (task && task.displayTimer) clearInterval(task.displayTimer);
            activeTasks.delete(taskId);
            renderTaskRecords();
            saveTaskRecords();
        }
        
        function clearTaskRecords() {
            if (!confirm('确定要清空所有任务记录吗？')) return;
            activeTasks.forEach(task => {
                if (task.timer) clearInterval(task.timer);
                if (task.displayTimer) clearInterval(task.displayTimer);
            });
            activeTasks.clear();
            renderTaskRecords();
            saveTaskRecords();
        }
        
        function trimTaskRecords() {
            const limit = parseInt(document.getElementById('taskRecordLimit').value) || 30;
            const tasks = Array.from(activeTasks.entries());
            if (tasks.length <= limit) return;
            // 删除最旧的已完成/失败任务
            const toRemove = tasks.filter(([, t]) => t.status === 'succeeded' || t.status === 'failed');
            while (activeTasks.size > limit && toRemove.length > 0) {
                const [id, task] = toRemove.shift();
                if (task.timer) clearInterval(task.timer);
                if (task.displayTimer) clearInterval(task.displayTimer);
                activeTasks.delete(id);
            }
        }
        
        function saveTaskRecords() {
            const records = [];
            activeTasks.forEach((task, id) => {
                records.push({ ...task, timer: null, displayTimer: null });
            });
            localStorage.setItem('seedance_task_records', JSON.stringify(records));
        }
        
        function loadTaskRecords() {
            const records = JSON.parse(localStorage.getItem('seedance_task_records') || '[]');
            records.forEach(record => {
                record.timer = null;
                activeTasks.set(record.id, record);
                // 恢复运行中任务的轮询
                if (record.status === 'running') {
                    startPollingForTask(record.id);
                }
            });
            renderTaskRecords();
        }
        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        
        // ==================== 历史记录（底部） ====================
        function addToHistory(record) {
            let history = JSON.parse(localStorage.getItem('seedance_history') || '[]');
            const limit = parseInt(document.getElementById('historyLimitConfig').value) || 30;
            
            history.unshift(record);
            if (history.length > limit) history = history.slice(0, limit);
            
            localStorage.setItem('seedance_history', JSON.stringify(history));
            loadHistory();
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('seedance_history') || '[]');
            const container = document.getElementById('historyList');
            
            if (history.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无生成记录</div>';
                return;
            }
            
            container.innerHTML = history.map((item, index) => `
                <div class="history-item">
                    <div class="history-thumb" onclick="playHistoryVideo(${index})">
                        <video src="${item.videoUrl}" preload="metadata"></video>
                    </div>
                    <div class="history-info">
                        <div>${new Date(item.time).toLocaleString()}</div>
                        <div style="font-size:11px;color:#86909c;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;" title="${escapeHtml(item.prompt || '')}">${escapeHtml((item.prompt || '').substring(0, 40))}</div>
                    </div>
                    <div class="history-actions">
                        <button class="btn btn-primary btn-sm" onclick="playHistoryVideo(${index})">▶️ 预览</button>
                        <button class="btn btn-success btn-sm" onclick="reuseHistory(${index})">🔄 复用</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteHistory(${index})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }
        
        function playHistoryVideo(index) {
            const history = JSON.parse(localStorage.getItem('seedance_history') || '[]');
            const item = history[index];
            if (item && item.videoUrl) {
                document.getElementById('playerWindow').style.display = 'block';
                document.getElementById('resultVideo').src = item.videoUrl;
                document.getElementById('downloadLink').href = item.videoUrl;
                document.getElementById('playerInfoText').textContent = `任务 ID: ${item.id || 'N/A'}`;
                document.getElementById('playerWindow').scrollIntoView({ behavior: 'smooth' });
            }
        }
        
        function reuseHistory(index) {
            const history = JSON.parse(localStorage.getItem('seedance_history') || '[]');
            const item = history[index];
            if (!item) return;
            
            if (item.params) {
                if (item.params.model) setSelectedModelId(item.params.model);
                if (item.params.resolution) document.getElementById('resolution').value = item.params.resolution;
                if (item.params.ratio) document.getElementById('ratio').value = item.params.ratio;
                if (item.params.duration) document.getElementById('duration').value = item.params.duration;
                if (item.params.seed !== undefined) document.getElementById('seed').value = item.params.seed;
                if (item.params.generateAudio !== undefined) document.getElementById('generateAudio').checked = item.params.generateAudio;
            }
            
            if (item.assets) {
                assets = JSON.parse(JSON.stringify(item.assets));
                updateAssetsList();
            }
            
            if (item.promptHtml) {
                promptEditor.innerHTML = item.promptHtml;
            } else if (item.prompt) {
                promptEditor.innerHTML = '';
                promptEditor.textContent = item.prompt;
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            alert('已复用历史配置，可在此基础上修改后重新提交');
        }
        
        function deleteHistory(index) {
            let history = JSON.parse(localStorage.getItem('seedance_history') || '[]');
            history.splice(index, 1);
            localStorage.setItem('seedance_history', JSON.stringify(history));
            loadHistory();
        }
        
        function clearHistory() {
            if (confirm('确定要清空所有历史记录吗？')) {
                localStorage.removeItem('seedance_history');
                loadHistory();
            }
        }
    </script>
</body>
